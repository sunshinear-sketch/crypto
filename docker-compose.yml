services:
  app:
    build: .
    restart: unless-stopped
    environment:
      ADDR: :8080
      BINANCE_BASE_URL: ${BINANCE_BASE_URL:-https://fapi.binance.com}
      SCAN_INTERVAL: ${SCAN_INTERVAL:-4h}
      ADMIN_API_KEY: ${ADMIN_API_KEY:?Set ADMIN_API_KEY in .env}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
    volumes:
      - appdata:/data
    working_dir: /data
    ports:
      - "127.0.0.1:8080:8080"
volumes:
  appdata:
